  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}html{scroll-behavior:smooth;}body{font-family:-apple-system,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#faf7f4;color:#3a3636;line-height:1.65;min-height:100vh;overflow-x:hidden;}
    :root{--rose-900:#6b4c4c;--rose-800:#7d5a5a;--rose-700:#9c7373;--rose-600:#b08d8d;--rose-500:#c9a4a4;--rose-400:#dbbfbf;--rose-300:#ead5d5;--rose-200:#f0e4e4;--rose-100:#f7efef;--rose-50:#faf6f3;--teal-700:#4a7a8a;--teal-600:#6a8fa4;--teal-500:#89afc0;--teal-100:#e4f0f4;--cream:#faf7f4;--warm-white:#fff9f6;--paper:#fff;--shadow-sm:0 1px 3px rgba(107,76,76,.06);--shadow-md:0 4px 12px rgba(107,76,76,.08);--shadow-lg:0 8px 30px rgba(107,76,76,.12);--shadow-xl:0 16px 48px rgba(107,76,76,.16);--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:22px;--transition:all .2s cubic-bezier(.4,0,.2,1);}

  function getProTip(r){if(r.category==='調香'){const res=concResult(r);if(res){if(res.ok)return`💡 香精濃度 ${res.pct}%，符合 ${r.concType} 標準（${res.std.min}-${res.std.max}%）`;const tooLow=res.pct<res.std.min;return`💡 香精濃度 ${res.pct}%，${tooLow?'建議增加香精或減少酒精':'建議增加載體/酒精'}`;}if(!r.concType)return'💡 選擇濃度級別（EDP/EDT 等）可獲得專業濃度分析';}if(r.category==='手工皂'){const oils=(r.groups||[]).find(g=>/油脂/.test(g.name));const naoh=(r.groups||[]).find(g=>/鹼水/.test(g.name));if(oils&&naoh){const totalOil=(oils.items||[]).reduce((s,i)=>s+(parseFloat(i.gram)||0),0);const naohGram=(naoh.items||[]).reduce((s,i)=>s+(parseFloat(i.gram)||0),0);if(totalOil>0&&naohGram>0){const ratio=Math.round(naohGram/totalOil*10000)/100;return`💡 鹼液率約 ${ratio}%（NaOH/油脂），一般冷製皂 5-8%`;}}return'💡 填齊油脂同 NaOH 克數，系統會自動計算鹼液率';}if(r.category==='蠟燭'){const waxG=(r.groups||[]).reduce((s,g)=>(/蠟/.test(g.name)?(g.items||[]).reduce((ss,i)=>ss+(parseFloat(i.gram)||0),0):0),0);const foG=(r.groups||[]).reduce((s,g)=>(/香精/.test(g.name)?(g.items||[]).reduce((ss,i)=>ss+(parseFloat(i.gram)||0),0):0),0);if(waxG>0&&foG>0){const foPct=Math.round(foG/(waxG+foG)*1000)/10;const safe=foPct<=10;return`💡 香精佔比 ${foPct}%，${safe?'在安全範圍（建議 ≤10%）':'⚠️ 超過 10%，可能影響燃燒或致過敏'}`;}return'💡 大豆蠟香精量建議 6-10%，過多可能影響燃燒品質';}if(r.category==='手工護膚品'){const water=(r.groups||[]).reduce((s,g)=>(/水相/.test(g.name)?(g.items||[]).reduce((ss,i)=>ss+(parseFloat(i.gram)||0),0):0),0);const oil=(r.groups||[]).reduce((s,g)=>(/油相/.test(g.name)?(g.items||[]).reduce((ss,i)=>ss+(parseFloat(i.gram)||0),0):0),0);if(water>0&&oil>0){const ratio=Math.round(water/(water+oil)*1000)/10;return`💡 水油比 ${Math.round(ratio*10)/10}:${Math.round((100-ratio)*10)/10}，${ratio>50?'乳液質地偏清爽':'質地偏滋潤厚重'}`;}return'💡 水油比例影響質地：水多清爽、油多滋潤';}return'';}

  function processImportedProductRows(rows){if(!rows||rows.length<2){alert('表格內容為空');return;}let headerIdx=0;for(let i=0;i<Math.min(rows.length,5);i++){if((rows[i][0]||'').toString().includes('產品名稱')){headerIdx=i;break;}}const dataRows=rows.slice(headerIdx+1).filter(r=>r[0]&&String(r[0]).trim());if(!dataRows.length){alert('找不到產品資料');return;}const imported=dataRows.map(r=>{const name=String(r[0]||'').trim();const tags=String(r[1]||'').split(',').map(s=>s.trim()).filter(Boolean);const spec=String(r[2]||'').trim();const packaging=String(r[3]||'').trim();const price=String(r[4]||'').trim();const cost=String(r[5]||'').trim();const stock=String(r[6]||'').trim();const client=String(r[7]||'').trim();const shelfLife=String(r[8]||'').trim();const storage=String(r[9]||'').trim();const caution=String(r[10]||'').trim();const note=String(r[11]||'').trim();const linkedNames=String(r[12]||'').split(',').map(s=>s.trim()).filter(Boolean);const recipeIds=linkedNames.map(n=>{const found=recipes.find(x=>x.name===n);return found?found.id:null;}).filter(Boolean);return{id:'p'+Date.now()+Math.random().toString(36).slice(2),name,tags,spec,packaging,price,cost,stock,client,shelfLife,storage,caution,note,recipeIds,photo:'',customFields:[]};}).filter(p=>p.name);if(!imported.length){alert('冇搵到有效產品');return;}const mode=confirm(`搵到 ${imported.length} 件產品。\n按「確定」= 合併加入\n按「取消」= 覆蓋`);if(mode){const existing=new Set(products.map(p=>p.name));let added=0;imported.forEach(p=>{if(!existing.has(p.name)){products.push(p);added++;}});saveProducts();renderProdList();renderProdTagTabs();renderProdTagFilter();alert(`匯入完成！新增 ${added} 件產品`);}else{if(confirm('確定覆蓋？')){products=imported;saveProducts();renderProdList();renderProdTagTabs();renderProdTagFilter();alert(`已匯入 ${imported.length} 件產品`);}}}
  function parseXlsxRows(arrayBuffer){const zip=unzipAll(new Uint8Array(arrayBuffer));const ssXml=zip['xl/sharedStrings.xml']||'';const ssArr=[];if(ssXml){const siRe=/<si>([\s\S]*?)<\/si>/g;let m;while((m=siRe.exec(ssXml))!==null){let val='';const tRe=/<t(?:\s[^>]*)?>([^<]*)<\/t>/g;let tm;while((tm=tRe.exec(m[1]))!==null)val+=tm[1];ssArr.push(decodeXmlEntities(val));}}let sheetPath='xl/worksheets/sheet1.xml';const sheetXml=zip[sheetPath]||zip['xl/worksheets/Sheet1.xml']||'';const rows=[];const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g;let rm;while((rm=rowRe.exec(sheetXml))!==null){const cells=[];const cRe=/<c r="([A-Z]+)(\d+)"([^>]*)>([\s\S]*?)<\/c>/g;let cm;while((cm=cRe.exec(rm[1]))!==null){const col=colToIdx(cm[1]);const t=(cm[3].match(/t="([^"]+)"/)||[])[1];const vMatch=cm[4].match(/<v>([^<]*)<\/v>/);let val='';if(vMatch){if(t==='s')val=ssArr[parseInt(vMatch[1])]||'';else val=vMatch[1];}while(cells.length<col)cells.push('');cells[col]=val;}if(cells.some(c=>c!==''))rows.push(cells);}return rows;}
  function colToIdx(col){let n=0;for(let i=0;i<col.length;i++)n=n*26+(col.charCodeAt(i)-64);return n-1;}
  function decodeXmlEntities(s){return s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'");}
  function unzipAll(data){const files={};let i=0;while(i<data.length-3){if(data[i]===0x50&&data[i+1]===0x4B&&data[i+2]===0x03&&data[i+3]===0x04){const compression=data[i+8]|(data[i+9]<<8);const compSz=data[i+18]|(data[i+19]<<8)|(data[i+20]<<16)|(data[i+21]<<24);const nameLen=data[i+26]|(data[i+27]<<8);const extraLen=data[i+28]|(data[i+29]<<8);const name=new TextDecoder().decode(data.slice(i+30,i+30+nameLen));const dataStart=i+30+nameLen+extraLen;let content=data.slice(dataStart,dataStart+compSz);if(name.endsWith('.xml')||name.endsWith('.rels'))files[name]=new TextDecoder('utf-8').decode(content);else files[name]=content;i=dataStart+compSz;}else{i++;}}return files;}
  function parseCsv(text){const lines=text.split(/\r?\n/);return lines.map(line=>{const cells=[];let cur='';let inQ=false;for(let i=0;i<line.length;i++){if(line[i]==='"')inQ=!inQ;else if(line[i]===','&&!inQ){cells.push(cur);cur='';}else cur+=line[i];}cells.push(cur);return cells;}).filter(r=>r.some(c=>c.trim()));}

  // ===== 主導航 =====
  function switchMainTab(tab){currentMainTab=tab;document.getElementById('mainTab-recipe').classList.toggle('active',tab==='recipe');document.getElementById('mainTab-product').classList.toggle('active',tab==='product');document.getElementById('section-recipe').style.display=tab==='recipe'?'':'none';document.getElementById('section-product').style.display=tab==='product'?'':'none';document.getElementById('mainFab').className='fab'+(tab==='product'?' product-mode':'');if(tab==='product'){renderProdTagTabs();renderProdList();}}
  function onFabClick(){if(currentMainTab==='product')openProdEditor();else openEditor();}
  function getAllRecipeTags(){const set=new Set();recipes.filter(r=>r.category===currentCat).forEach(r=>(r.tags||[]).forEach(t=>t&&set.add(t)));return[...set];}
  function getAllProdTags(){const set=new Set();products.forEach(p=>(p.tags||[]).forEach(t=>t&&set.add(t)));return[...set];}
  function renderRecipeTagFilter(){const tags=getAllRecipeTags();const el=document.getElementById('recipeTagFilter');if(!tags.length){el.innerHTML='';return;}el.innerHTML=tags.map(t=>`<button class="filter-chip ${activeRecipeTagFilter===t?'active':''}" onclick="toggleRecipeTagFilter('${esc(t)}')">${esc(t)}</button>`).join('');}
  function toggleRecipeTagFilter(t){activeRecipeTagFilter=(activeRecipeTagFilter===t?null:t);renderRecipeTagFilter();renderList();}
  function renderProdTagFilter(){const tags=getAllProdTags();const el=document.getElementById('prodTagFilter');if(!tags.length){el.innerHTML='';return;}el.innerHTML=tags.map(t=>`<button class="filter-chip ${activeProdTagFilter===t?'active':''}" onclick="toggleProdTagFilter('${esc(t)}')">${esc(t)}</button>`).join('');}
  function toggleProdTagFilter(t){activeProdTagFilter=(activeProdTagFilter===t?null:t);renderProdTagFilter();renderProdList();}
  function renderTabs(){document.getElementById('tabs').innerHTML=Object.keys(CATEGORIES).map(c=>`<button class="tab ${c===currentCat?'active':''}" onclick="switchCat('${c}')">${c}</button>`).join('');}
  function switchCat(c){currentCat=c;activeRecipeTagFilter=null;renderTabs();renderRecipeTagFilter();renderList();}
  function renderList(){const kw=document.getElementById('search').value.trim().toLowerCase();const list=document.getElementById('list');let items=recipes.filter(r=>r.category===currentCat);if(kw)items=items.filter(r=>r.name.toLowerCase().includes(kw)||(r.tags||[]).some(t=>t.toLowerCase().includes(kw))||(r.groups||[]).some(g=>(g.items||[]).some(i=>i.name.toLowerCase().includes(kw))));if(activeRecipeTagFilter)items=items.filter(r=>(r.tags||[]).includes(activeRecipeTagFilter));if(!items.length){list.innerHTML=`<div class="empty"><div class="empty-icon">🧪</div><h3>尚未建立${esc(currentCat)}配方</h3><p>點擊右下角 ＋ 按鈕<br>建立你的第一條配方吧！</p></div>`;return;}list.innerHTML=items.map(r=>{const total=totalGram(r);const cnt=totalIngCount(r);const conc=r.concType?`<span class="conc">${r.concType}</span>`:'';const ingCnt=cnt?`<span class="ing-count">・ ${cnt} 款成分</span>`:'';const demoBadge=isDemoRecipe(r)?`<span class="tag-chip demo-badge">📖 示範</span>`:'';const tip=getProTip(r);const tipHtml=tip?`<div class="pro-tip"><span class="tip-icon">💡</span><span>${esc(tip)}</span></div>`:'';return`<div class="recipe-card" onclick="showDetail('${r.id}')"><h3>${esc(r.name)}${conc}</h3><div class="meta">${r.date||''} ・ 總重 ${total}g${ingCnt}</div><div class="tags">${(r.tags||[]).map(t=>`<span class="tag-chip">${esc(t)}</span>`).join('')}${demoBadge}</div>${tipHtml}</div>`;}).join('');}
  function getCfTemplateForTags(tags){const fields=[];(tags||[]).forEach(tag=>{const tpl=cfTemplates.find(t=>t.tag===tag);if(tpl)tpl.fields.forEach(f=>{if(f.name.trim()&&!fields.find(x=>x.name===f.name))fields.push({name:f.name,type:f.type,value:''});});});return fields;}
  function openEditor(id){editingId=id||null;_showCfAddForm.recipe=false;let r;if(id){r=JSON.parse(JSON.stringify(recipes.find(x=>x.id===id)));}else{r={id:'r'+Date.now(),category:currentCat,name:'',date:new Date().toISOString().slice(0,10),tags:[],note:'',capacity:'',concType:(currentCat==='調香'?'EDP':''),groups:CATEGORIES[currentCat].map(n=>({name:n,items:[{name:'',gram:''}]})),steps:[],customFields:[]};}window._editing=r;renderEditor();document.getElementById('editorBg').classList.add('show');}
  function copyRecipe(id){closeDetail();const src=recipes.find(x=>x.id===id);const copy=JSON.parse(JSON.stringify(src));copy.id='r'+Date.now();copy.name=src.name+' (複製)';copy.date=new Date().toISOString().slice(0,10);copy.customFields=(copy.customFields||[]).map(f=>({...f,value:''}));if(copy.tags)copy.tags=copy.tags.filter(t=>t!=='示範配方');editingId=null;_showCfAddForm.recipe=false;window._editing=copy;renderEditor();document.getElementById('editorBg').classList.add('show');}
  function renderEditor(){
    const r=window._editing;const total=totalGram(r);
    const concSel=r.category==='調香'?`<div class="field"><label>香水濃度級別</label><select id="f-conc" onchange="window._editing.concType=this.value;rerenderConcCheck()"><option value="">（唔指定）</option>${Object.keys(CONC).map(k=>`<option value="${k}" ${r.concType===k?'selected':''}>${k} — ${CONC[k].label}（${CONC[k].min}-${CONC[k].max}%）</option>`).join('')}</select></div>`:'';
    const cfHtml=renderCustomFieldsEditor(r.customFields||[]);
    document.getElementById('editorModal').innerHTML=`
      <h2>${editingId?'✏️ 編輯配方':'➕ 新增配方'}（${r.category}）</h2>
      <div class="ai-btn-row">
        <button class="ai-btn" onclick="scanRecipeImage('camera')">📷 拍照辨識</button>
        <button class="ai-btn" onclick="scanRecipeImage('file')">🖼️ 上傳圖片</button>
      </div>
      <div class="ai-loading" id="aiLoading"><span class="spinner"></span>AI 辨識中…</div>
      <div class="field"><label>配方名稱</label><input id="f-name" value="${esc(r.name)}" placeholder="例：春日花園香水" oninput="window._editing.name=this.value"></div>
      ${concSel}
      <div class="field"><label>容量 / 淨重（標籤用）</label><input id="f-cap" value="${esc(r.capacity||'')}" placeholder="例：50ml" oninput="window._editing.capacity=this.value"></div>
      <div class="field"><label>製作日期</label><input type="date" id="f-date" value="${r.date}" oninput="window._editing.date=this.value"></div>
      <div class="field"><label>標籤（逗號分隔）</label><input id="f-tags" value="${esc((r.tags||[]).join(', '))}" placeholder="例：命理調香, 花香" oninput="onTagsInput(this)"></div>
      ${renderConcHint(r)}
      <label style="font-size:13px;color:var(--rose-400);font-weight:600;letter-spacing:.3px;display:block;margin-bottom:10px;">成分分組</label>
      <div id="groups">${r.groups.map((g,gi)=>renderGroup(g,gi,total)).join('')}</div>
      <button class="btn btn-sm" onclick="addGroup()" style="width:100%;margin-bottom:12px;">➕ 新增分組</button>
      <div class="total-bar" id="totalBar"><span>總重量</span><span>${total} g ・ 100%</span></div>
      <div id="concCheck">${renderConcCheck(r)}</div>
      <div id="stepsSection"><div class="cf-section-title">📝 製作過程<button class="btn btn-sm" style="padding:5px 10px;font-size:12px;" onclick="addStep()">＋ 加步驟</button></div>${(r.steps||[]).map((st,si)=>`<div class="step-row"><span class="step-num">${si+1}</span><input class="step-input" value="${esc(st.desc)}" placeholder="描述此步驟…" oninput="window._editing.steps[${si}].desc=this.value"><button class="icon-btn" onclick="delStep(${si})">✕</button><button class="icon-btn" onclick="moveStepUp(${si})" ${si===0?'disabled':''}>▲</button><button class="icon-btn" onclick="moveStepDown(${si})" ${si===(r.steps||[]).length-1?'disabled':''}>▼</button></div>`).join('')}${!(r.steps||[]).length?'<div style="font-size:13px;color:var(--rose-300);margin-bottom:10px;">尚未新增製作步驟</div>':''}</div>
      <div class="field"><label>備註 / 心得</label><textarea id="f-note" rows="3" oninput="window._editing.note=this.value">${esc(r.note||'')}</textarea></div>
      ${cfHtml}
      <div class="btn-row"><button class="btn btn-ghost" onclick="closeEditor()">取消</button><button class="btn btn-primary" onclick="saveRecipe()" style="flex:2;">儲存</button></div>
      ${editingId?`<button class="btn btn-del" style="width:100%;margin-top:12px;" onclick="deleteRecipe()">🗑️ 刪除此配方</button>`:''}`;
  }
  function onTagsInput(el){const tags=el.value.split(',').map(s=>s.trim()).filter(Boolean);window._editing.tags=tags;const tplFields=getCfTemplateForTags(tags);const existing=window._editing.customFields||[];let added=false;tplFields.forEach(f=>{if(!existing.find(e=>e.name===f.name)){existing.push(f);added=true;}});window._editing.customFields=existing;if(added){const cfWrap=document.getElementById('cfWrap');if(cfWrap)cfWrap.outerHTML=renderCustomFieldsEditor(existing);}const hintEl=document.getElementById('concHint');if(hintEl)hintEl.outerHTML=renderConcHint(window._editing);}
  function renderConcHint(r){if(r.category!=='調香'||!r.concType)return'<span id="concHint"></span>';const groupNames=(r.groups||[]).map(g=>g.name);const hasScentGroup=groupNames.some(n=>SCENT_GROUPS.includes(n));if(!hasScentGroup&&r.groups.length>0){return`<div class="conc-hint" id="concHint">⚠️ 濃度計算提示：系統以「前調/中調/後調」分組名計算香精比例。若你已改名，請確保至少一個分組名吻合。</div>`;}return'<span id="concHint"></span>';}
  function renderCustomFieldsEditor(fields){if(!fields)fields=[];const addFormHtml=_showCfAddForm.recipe?`<div class="cf-add-row" id="cfAddRow"><input id="cfNewName" placeholder="欄位名稱（如：五行）" autocomplete="off"><select id="cfNewType">${CF_TYPES.map(t=>`<option value="${t.v}">${t.l}</option>`).join('')}</select><button class="btn-confirm" onclick="confirmAddCf('recipe')">確認</button><button class="icon-btn" onclick="_showCfAddForm.recipe=false;rerenderCfSection('recipe')">✕</button></div>`:'';let rows='';if(!fields.length&&!_showCfAddForm.recipe)rows=`<div style="font-size:13px;color:var(--rose-300);margin-bottom:10px;">尚未新增自訂欄位</div>`;else fields.forEach((f,i)=>{rows+=`<div class="custom-field-row"><span class="cf-label">${esc(f.name)}</span>${f.type==='date'?`<input type="date" value="${esc(f.value||'')}" oninput="window._editing.customFields[${i}].value=this.value">`:`<input type="${f.type==='number'?'number':'text'}" value="${esc(f.value||'')}" placeholder="請填寫" oninput="window._editing.customFields[${i}].value=this.value">`}<button class="icon-btn" onclick="removeCf('recipe',${i})">✕</button></div>`;});return`<div id="cfWrap"><div class="cf-section-title">✨ 自訂欄位<button class="btn btn-sm" style="padding:5px 10px;font-size:12px;" onclick="showCfAddForm('recipe')">＋ 新增欄位</button></div>${addFormHtml}${rows}</div>`;}
  function showCfAddForm(mode){_showCfAddForm[mode]=true;if(mode==='recipe')rerenderCfSection('recipe');else rerenderCfSection('product');}
  function rerenderCfSection(mode){if(mode==='recipe'){const el=document.getElementById('cfWrap');if(el)el.outerHTML=renderCustomFieldsEditor(window._editing.customFields||[]);}else{const el=document.getElementById('cfWrapProd');if(el)el.outerHTML=renderProdCustomFieldsEditor(window._editingProd.customFields||[]);}}
  function confirmAddCf(mode){const nameEl=document.getElementById('cfNewName');const typeEl=document.getElementById('cfNewType');const name=(nameEl&&nameEl.value||'').trim();const type=(typeEl&&typeEl.value)||'text';if(!name){nameEl&&nameEl.focus();return;}if(mode==='recipe'){window._editing.customFields=window._editing.customFields||[];window._editing.customFields.push({name,type,value:''});_showCfAddForm.recipe=false;rerenderCfSection('recipe');}else{window._editingProd.customFields=window._editingProd.customFields||[];window._editingProd.customFields.push({name,type,value:''});_showCfAddForm.product=false;rerenderCfSection('product');}}
  function removeCf(mode,i){if(mode==='recipe'){window._editing.customFields.splice(i,1);rerenderCfSection('recipe');}else{window._editingProd.customFields.splice(i,1);rerenderCfSection('product');}}
  function rerenderConcCheck(){const r=window._editing;const hintEl=document.getElementById('concHint');if(hintEl)hintEl.outerHTML=renderConcHint(r);const cc=document.getElementById('concCheck');if(cc)cc.innerHTML=renderConcCheck(r);}
  function renderConcCheck(r){const res=concResult(r);if(!res)return'';if(res.ok)return`<div class="conc-check conc-ok">✓ 香精濃度 ${res.pct}% — 符合 ${r.concType}（${res.std.min}-${res.std.max}%）標準<div class="conc-info">香精 ${res.scent}g / 總液體 ${res.total}g</div></div>`;const tooLow=res.pct<res.std.min;return`<div class="conc-check conc-warn">⚠️ 香精濃度 ${res.pct}% — ${tooLow?'低於':'高於'} ${r.concType} 標準（${res.std.min}-${res.std.max}%）<div class="conc-info">香精 ${res.scent}g / 總液體 ${res.total}g｜建議${tooLow?'增加香精':'增加載體/酒精'}</div></div>`;}
  function renderGroup(g,gi,total){const itemsHtml=(g.items||[]).map((it,ii)=>{const pct=total>0?Math.round((parseFloat(it.gram)||0)/total*1000)/10:0;return`<div class="ingredient-row" data-gi="${gi}" data-ii="${ii}"><div class="ac-wrap"><input class="name" value="${esc(it.name)}" placeholder="輸入成分名稱…" oninput="updItem(${gi},${ii},'name',this.value);showAC(this,${gi},${ii})" onfocus="showAC(this,${gi},${ii})" onblur="setTimeout(hideAC,200)" autocomplete="off"><div class="ac-list" id="ac-list"></div></div><input class="gram" type="number" value="${it.gram}" placeholder="g" oninput="updItem(${gi},${ii},'gram',this.value);liveTotal()"><span class="pct" id="pct-${gi}-${ii}">${pct}%</span><button class="icon-btn" onclick="delItem(${gi},${ii})">✕</button></div>`;}).join('');return`<div class="group-box"><div class="group-header"><input value="${esc(g.name)}" oninput="updGroupName(${gi},this.value)" placeholder="分組名"><button class="icon-btn" onclick="delGroup(${gi})">🗑️</button></div>${itemsHtml}<button class="btn btn-sm" onclick="addItem(${gi})">➕ 加成分</button></div>`;}
  function liveTotal(){const r=window._editing,total=totalGram(r);r.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{const el=document.getElementById(`pct-${gi}-${ii}`);if(el){const p=total>0?Math.round((parseFloat(it.gram)||0)/total*1000)/10:0;el.textContent=p+'%';}}));const tb=document.getElementById('totalBar');if(tb)tb.innerHTML=`<span>總重量</span><span>${total} g ・ 100%</span>`;const cc=document.getElementById('concCheck');if(cc)cc.innerHTML=renderConcCheck(r);}
  function updItem(gi,ii,k,v){window._editing.groups[gi].items[ii][k]=v;}
  function updGroupName(gi,v){window._editing.groups[gi].name=v;liveTotal();const hintEl=document.getElementById('concHint');if(hintEl)hintEl.outerHTML=renderConcHint(window._editing);}
  function addItem(gi){window._editing.groups[gi].items.push({name:'',gram:''});renderEditor();}
  function delItem(gi,ii){window._editing.groups[gi].items.splice(ii,1);renderEditor();}
  function addGroup(){window._editing.groups.push({name:'新分組',items:[{name:'',gram:''}]});renderEditor();}
  function delGroup(gi){if(confirm('刪除呢個分組？')){window._editing.groups.splice(gi,1);renderEditor();}}
  function addStep(){window._editing.steps=window._editing.steps||[];window._editing.steps.push({desc:''});renderEditor();}
  function delStep(si){window._editing.steps.splice(si,1);renderEditor();}
  function moveStepUp(si){if(si<=0)return;const steps=window._editing.steps;const t=steps[si];steps[si]=steps[si-1];steps[si-1]=t;renderEditor();}
  function moveStepDown(si){const steps=window._editing.steps;if(si>=steps.length-1)return;const t=steps[si];steps[si]=steps[si+1];steps[si+1]=t;renderEditor();}
  function saveRecipe(){const r=window._editing;if(!r.name.trim()){alert('請填寫配方名稱');return;}r.groups.forEach(g=>g.items=g.items.filter(i=>i.name.trim()&&(parseFloat(i.gram)>0)));if(editingId){const idx=recipes.findIndex(x=>x.id===editingId);recipes[idx]=r;}else recipes.push(r);save();closeEditor();renderList();renderRecipeTagFilter();}

-ing{font-size:9px;-webkit-line-clamp:2;margin-top:4px;}.label.round .l-note{font-size:8px;-webkit-line-clamp:1;margin-top:4px;}.label.round .l-cf{font-size:9px;margin:1px 0;}.label.round .l-qr{width:36px;height:36px;margin:4px auto 0;}.label.round.style-minimal .l-brand{display:none;}.label.round.style-minimal .l-name{font-size:18px;font-weight:800;color:#6b4c4c;}.label.round.style-minimal .l-conc{font-size:10px;letter-spacing:3px;}.label.round.style-minimal .l-line{width:40px;height:1px;background:#ead5d5;}.label.round.style-minimal .l-info{font-size:11px;color:#b08d8d;font-weight:500;}.label.round.style-minimal .l-ing,.label.round.style-minimal .l-note,.label.round.style-minimal .l-qr{display:none;}.label.round.style-artisan .l-brand{font-size:8px;letter-spacing:4px;margin-bottom:6px;}.label.round.style-artisan .l-name{font-size:14px;font-weight:600;letter-spacing:1px;color:#9c7373;}.label.round.style-artisan .l-conc{font-size:8px;letter-spacing:3px;text-transform:uppercase;}.label.round.style-artisan .l-line{width:50px;height:1px;background:linear-gradient(90deg,transparent,#dbbfbf,transparent);}.label.round.style-artisan .l-info{font-size:9px;letter-spacing:.5px;}.label.round.style-artisan .l-ing{font-size:8px;-webkit-line-clamp:2;font-style:italic;}.label.round.style-artisan .l-note{display:none;}.label.fs-s .l-name{font-size:14px!important;}.label.fs-s .l-brand{font-size:9px!important;}.label.fs-s .l-info{font-size:10px!important;}.label.fs-s .l-ing{font-size:9px!important;}.label.fs-s .l-cf{font-size:9px!important;}.label.fs-l .l-name{font-size:20px!important;}.label.fs-l .l-brand{font-size:12px!important;}.label.fs-l .l-info{font-size:12px!important;}.label.fs-l .l-ing{font-size:11px!important;}.label.fs-l .l-cf{font-size:11px!important;}.label.round.fs-s .l-name{font-size:13px!important;}.label.round.fs-s .l-info{font-size:9px!important;}.label.round.fs-l .l-name{font-size:17px!important;}.label.round.fs-l .l-info{font-size:11px!important;}`;}
  function printLabel(){const inner=labelInnerHTML();const title=labelRecipe?labelRecipe.name:(labelProduct?labelProduct.name:'標籤');const htmlContent=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>打印標籤 - ${esc(title)}</title><style>${getLabelPrintCSS()}</style></head><body>${renderLabelHTML()}</body></html>`;const w=window.open('','_blank','width=500,height=600');if(w){w.document.open();w.document.write(htmlContent);w.document.close();setTimeout(function(){try{w.focus();w.print();}catch(e){}},800);}else{alert('⚠️ 新視窗被瀏覽器攔截！\n\n請允許彈出視窗，或者使用「💾 下載 HTML」按鈕。');downloadLabelHTML();}}

  function renderSettingsModal(){const tplHtml=renderCfTemplateManager();document.getElementById('settingsModal').innerHTML=`<h2>⚙️ 設定</h2><div class="settings-section"><div class="settings-section-title">品牌資訊</div><div class="field"><label>品牌名稱（標籤頂部）</label><input id="s-brand" value="${esc(settings.brand)}"></div><div class="field"><label>預設保存期限</label><input id="s-expiry" value="${esc(settings.expiry)}"></div><div class="field"><label>預設注意事項</label><textarea id="s-caution" rows="2">${esc(settings.caution)}</textarea></div><div class="btn-row"><button class="btn btn-ghost" onclick="closeSettings()">取消</button><button class="btn btn-primary" onclick="doSaveSettings()" style="flex:2;">儲存品牌設定</button></div></div><div class="settings-section"><div class="settings-section-title">自訂欄位範本管理</div><p style="font-size:13px;color:var(--rose-300);margin-bottom:12px;">為每個標籤設定欄位範本，新增配方/產品選用對應標籤時自動帶出欄位。</p>${tplHtml}<button class="btn btn-sm" style="width:100%;margin-top:8px;" onclick="addCfTemplate()">➕ 新增標籤範本</button></div><div class="settings-section"><div class="settings-section-title">🤖 AI 辨識設定</div><p style="font-size:13px;color:var(--rose-300);margin-bottom:12px;">使用 Hugging Face 免費 AI 模型辨識配方圖片，自動填入資料。</p><div class="field"><label>Hugging Face Token</label><input id="s-aiKey" class="sync-input" value="${esc(aiConfig.token||'')}" placeholder="hf_xxxxxxxxxxxx"></div><div class="sync-hint">📌 前往 <a href="https://huggingface.co/settings/tokens" target="_blank" style="color:#4f46e5;">huggingface.co/settings/tokens</a> 建立 Read 權限 Token</div><div class="btn-row"><button class="btn btn-ghost" onclick="closeSettings()">取消</button><button class="btn btn-primary" onclick="doSaveAiConfig()" style="flex:2;">儲存 AI 設定</button></div></div><div class="settings-section"><div class="settings-section-title">☁️ 雲端同步設定</div><p style="font-size:13px;color:var(--rose-300);margin-bottom:12px;">使用 GitHub Gist 將資料同步到雲端。Gist 自帶版本歷史，可隨時翻睇舊版。設定一次後，任何裝置都可以上傳/下載。</p><div class="field"><label>GitHub Personal Access Token</label><input id="s-cloudToken" class="sync-input" value="${esc(cloudConfig.token||'')}" placeholder="ghp_xxxxxxxxxxxx"></div><div class="field"><label>Gist ID（自動建立，或手動輸入已有 Gist ID）</label><input id="s-cloudGistId" class="sync-input" value="${esc(cloudConfig.gistId||'')}" placeholder="留空 = 首次上傳時自動建立"></div><div class="sync-hint">📌 取得 Token：<br>1. 前往 <a href="https://github.com/settings/tokens" target="_blank" style="color:#4f46e5;">GitHub Settings → Tokens</a><br>2. 按「Generate new token (classic)」<br>3. 勾選 <b>gist</b> 權限即可<br>4. 複製 Token 貼到上方</div><div class="btn-row"><button class="btn btn-ghost" onclick="closeSettings()">取消</button><button class="btn btn-primary" onclick="doSaveCloudConfig()" style="flex:2;">儲存雲端設定</button></div></div>`;}
  function renderCfTemplateManager(){if(!cfTemplates.length)return`<div style="font-size:13px;color:var(--rose-300);margin-bottom:8px;">尚未設定任何範本</div>`;return cfTemplates.map((tpl,ti)=>`<div class="tpl-item"><div class="tpl-item-header"><span class="tpl-item-tag">🏷 ${esc(tpl.tag)}</span><button class="icon-btn" onclick="delCfTemplate(${ti})">🗑️</button></div>${(tpl.fields||[]).map((f,fi)=>`<div class="tpl-field-line"><input value="${esc(f.name)}" placeholder="欄位名稱" oninput="cfTemplates[${ti}].fields[${fi}].name=this.value;saveCfTpl()"><select onchange="cfTemplates[${ti}].fields[${fi}].type=this.value;saveCfTpl()">${CF_TYPES.map(t=>`<option value="${t.v}" ${f.type===t.v?'selected':''}>${t.l}</option>`).join('')}</select><button class="icon-btn" onclick="delCfTplField(${ti},${fi})">✕</button></div>`).join('')}<button class="btn btn-sm" style="width:100%;margin-top:4px;" onclick="addCfTplField(${ti})">＋ 加欄位</button></div>`).join('');}
  function addCfTemplate(){const tag=prompt('標籤名稱（例：命理調香）：');if(!tag||!tag.trim())return;if(cfTemplates.find(t=>t.tag===tag.trim())){alert('呢個標籤已有範本');return;}cfTemplates.push({tag:tag.trim(),fields:[{name:'',type:'text'}]});saveCfTpl();renderSettingsModal();}
  function delCfTemplate(ti){if(confirm('刪除此範本？')){cfTemplates.splice(ti,1);saveCfTpl();renderSettingsModal();}}

  function doSaveSettings(){settings.brand=document.getElementById('s-brand').value;settings.expiry=document.getElementById('s-expiry').value;settings.caution=document.getElementById('s-caution').value;saveSettings();closeSettings();}

  // ===== 雲端同步（GitHub Gist） =====
  let cloudConfig=JSON.parse(localStorage.getItem('cloudConfig')||'{}');

  function doSaveCloudConfig(){cloudConfig.token=document.getElementById('s-cloudToken').value.trim();cloudConfig.gistId=document.getElementById('s-cloudGistId').value.trim();saveCloudConfig();alert('☁️ 雲端同步設定已儲存！');renderSettingsModal();}
  function cloudUpload(){if(!cloudConfig.token){alert('⚠️ 請先到「設定 → 雲端同步」輸入 GitHub Token');openSettings();return;}const data={recipes,products,cfTemplates,settings,syncMeta:{lastSync:new Date().toISOString(),device:navigator.userAgent.slice(0,50),version:'v2'}};const jsonStr=JSON.stringify(data,null,2);const btn=event.target;if(btn){btn.disabled=true;btn.textContent='⏳ 上傳中...';}if(cloudConfig.gistId){const xhr=new XMLHttpRequest();xhr.open('PATCH','https://api.github.com/gists/'+cloudConfig.gistId,true);xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('Authorization','token '+cloudConfig.token);xhr.setRequestHeader('Accept','application/vnd.github.v3+json');xhr.onreadystatechange=function(){if(xhr.readyState===4){if(btn){btn.disabled=false;btn.textContent='☁️ 上傳到雲端';}if(xhr.status>=200&&xhr.status<300){cloudConfig.lastSync=new Date().toLocaleString('zh-HK');saveCloudConfig();alert('✅ 上傳成功！\n\n配方：'+recipes.length+' 條\n產品：'+products.length+' 件\n大小：'+Math.round(jsonStr.length/1024)+'KB');}else{let msg='上傳失敗';try{const r=JSON.parse(xhr.responseText);msg=r.message||msg;}catch(e){msg+='（HTTP '+xhr.status+'）';}alert('❌ '+msg);}}};xhr.send(JSON.stringify({description:'手工課配方管理 App 備份 ['+new Date().toLocaleString('zh-HK')+']',files:{'perfume-recipes.json':{content:jsonStr}}}));}else{const xhr=new XMLHttpRequest();xhr.open('POST','https://api.github.com/gists',true);xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('Authorization','token '+cloudConfig.token);xhr.setRequestHeader('Accept','application/vnd.github.v3+json');xhr.onreadystatechange=function(){if(xhr.readyState===4){if(btn){btn.disabled=false;btn.textContent='☁️ 上傳到雲端';}if(xhr.status>=200&&xhr.status<300){try{const r=JSON.parse(xhr.responseText);cloudConfig.gistId=r.id;cloudConfig.lastSync=new Date().toLocaleString('zh-HK');saveCloudConfig();alert('✅ 首次上傳成功！\n\nGist ID：'+cloudConfig.gistId+'\n（已自動儲存，下次唔使再輸入）\n\n配方：'+recipes.length+' 條\n產品：'+products.length+' 件\n\n💡 可到 gist.github.com 查看備份');}catch(e){alert('✅ 上傳成功，但解析回應失敗');}}else{let msg='上傳失敗';try{const r=JSON.parse(xhr.responseText);msg=r.message||msg;}catch(e){msg+='（HTTP '+xhr.status+'）';}alert('❌ '+msg);}}};xhr.send(JSON.stringify({description:'手工課配方管理 App 備份',public:false,files:{'perfume-recipes.json':{content:jsonStr}}}));}}
  function cloudDownload(){if(!cloudConfig.token){alert('⚠️ 請先到「設定 → 雲端同步」輸入 GitHub Token');openSettings();return;}if(!cloudConfig.gistId){alert('⚠️ 尚未建立雲端備份。請先按「☁️ 上傳到雲端」建立。');return;}const btn=event.target;if(btn){btn.disabled=true;btn.textContent='⏳ 下載中...';}const xhr=new XMLHttpRequest();xhr.open('GET','https://api.github.com/gists/'+cloudConfig.gistId,true);xhr.setRequestHeader('Authorization','token '+cloudConfig.token);xhr.setRequestHeader('Accept','application/vnd.github.v3+json');xhr.onreadystatechange=function(){if(xhr.readyState===4){if(btn){btn.disabled=false;btn.textContent='☁️ 從雲端下載';}if(xhr.status>=200&&xhr.status<300){try{const gist=JSON.parse(xhr.responseText);const file=gist.files['perfume-recipes.json'];if(!file||!file.content){alert('❌ 雲端資料格式不正確（搵唔到 perfume-recipes.json）');return;}const data=JSON.parse(file.content);if(!data.recipes){alert('❌ 雲端資料格式不正確');return;}const cloudCount=data.recipes.length;const localCount=recipes.length;const gistUrl='https://gist.github.com/'+cloudConfig.gistId;const gistHistory=gist.history?'（共 '+gist.history.length+' 個版本）':'';const msg='☁️ 雲端資料：\n- 配方：'+cloudCount+' 條\n- 產品：'+(data.products||[]).length+' 件'+gistHistory+'\n\n本地資料：\n- 配方：'+localCount+' 條\n- 產品：'+products.length+' 件\n\n請選擇：\n按「確定」= 雲端覆蓋本地\n按「取消」= 合併（雲端新嘅加入本地）';const mode=confirm(msg);if(mode){recipes=data.recipes;products=data.products||[];cfTemplates=data.cfTemplates||[];settings=data.settings||settings;save();saveProducts();saveCfTpl();saveSettings();renderList();renderRecipeTagFilter();cloudConfig.lastSync=new Date().toLocaleString('zh-HK');saveCloudConfig();alert('✅ 雲端資料已覆蓋本地！');}else{const localRecipeIds=new Set(recipes.map(r=>r.id));const localProdIds=new Set(products.map(p=>p.id));let addedR=0,addedP=0;(data.recipes||[]).forEach(r=>{if(!localRecipeIds.has(r.id)){recipes.push(r);addedR++;}});(data.products||[]).forEach(p=>{if(!localProdIds.has(p.id)){products.push(p);addedP++;}});if(data.cfTemplates&&data.cfTemplates.length>cfTemplates.length){cfTemplates=data.cfTemplates;}save();saveProducts();saveCfTpl();renderList();renderRecipeTagFilter();cloudConfig.lastSync=new Date().toLocaleString('zh-HK');saveCloudConfig();alert('✅ 合併完成！\n新增配方：'+addedR+' 條\n新增產品：'+addedP+' 件');}}catch(e){alert('❌ 解析雲端資料失敗：'+e.message);}}else{let msg='下載失敗';try{const r=JSON.parse(xhr.responseText);msg=r.message||msg;}catch(e){msg+='（HTTP '+xhr.status+'）';}alert('❌ '+msg);}}};xhr.send();}

  // ===== JSON 備份 / 還原 =====
  function exportData(){const blob=new Blob([JSON.stringify({recipes,products,cfTemplates,settings},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='手工課配方備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
  function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(data.recipes){if(confirm('匯入會覆蓋現有資料，確定？')){recipes=data.recipes;if(data.products)products=data.products;if(data.cfTemplates)cfTemplates=data.cfTemplates;if(data.settings)settings=data.settings;save();saveProducts();saveCfTpl();saveSettings();renderList();renderRecipeTagFilter();alert('匯入成功！');}}else if(Array.isArray(data)){if(confirm('匯入會覆蓋現有資料，確定？')){recipes=data;save();renderList();alert('匯入成功！');}}else alert('檔案格式唔啱');}catch(err){alert('讀取失敗：'+err.message);}};reader.readAsText(file);e.target.value='';}

  // ===== AI 辨識功能 =====
  let aiConfig=JSON.parse(localStorage.getItem('aiConfig')||'{}');
  function saveAiConfig(){localStorage.setItem('aiConfig',JSON.stringify(aiConfig));}
  function doSaveAiConfig(){aiConfig.token=document.getElementById('s-aiKey').value.trim();saveAiConfig();alert('🤖 AI 辨識設定已儲存！');renderSettingsModal();}
  function scanRecipeImage(mode){
    if(!aiConfig.token){alert('⚠️ 請先到「設定 → AI 辨識設定」輸入 Hugging Face Token');openSettings();return;}
    const input=document.createElement('input');input.type='file';input.accept='image/*';
    if(mode==='camera')input.capture='environment';
    input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{const dataUrl=ev.target.result;const match=dataUrl.match(/^data:(image\/\w+);base64,(.+)$/);if(!match){alert('❌ 圖片格式不支援');return;}const mimeType=match[1];const base64Data=match[2];callAIVision(base64Data,mimeType);};reader.readAsDataURL(file);};
    input.click();
  }
  function callAIVision(base64Data,mimeType){
    const loadEl=document.getElementById('aiLoading');if(loadEl)loadEl.classList.add('show');
    const btns=document.querySelectorAll('.ai-btn');btns.forEach(b=>b.disabled=true);
    const r=window._editing;
    const prompt=`你是一個配方辨識助手。請分析這張配方圖片，提取以下資訊並以 JSON 格式回覆（只回覆 JSON，不要其他文字）：
{
  "name": "配方名稱",
  "capacity": "容量或淨重",
  "date": "日期（YYYY-MM-DD格式）",
  "tags": ["標籤1","標籤2"],
  "groups": [
    {"name": "分組名（如前調/中調/後調/蠟/香精等）", "items": [{"name": "成分名", "gram": "克數"}]}
  ],
  "steps": ["步驟1","步驟2"],
  "note": "備註"
}
當前配方類別為「${r.category}」，請據此判斷分組名稱。如果某欄位在圖片中找不到，留空字串或空陣列。`;
    fetch('https://api-inference.huggingface.co/models/Qwen/Qwen3-VL-8B-Instruct/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+aiConfig.token},
      body:JSON.stringify({model:'Qwen/Qwen3-VL-8B-Instruct',messages:[{role:'user',content:[{type:'image_url',image_url:{url:`data:${mimeType};base64,${base64Data}`}},{type:'text',text:prompt}]}],max_tokens:1024})
    }).then(res=>{if(!res.ok)throw new Error('HTTP '+res.status);return res.json();}).then(data=>{
      const text=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'';
      const jsonMatch=text.match(/\{[\s\S]*\}/);
      if(!jsonMatch)throw new Error('AI 回覆格式不正確');
      const parsed=JSON.parse(jsonMatch[0]);
      applyScannedData(parsed);
      alert('✅ AI 辨識完成！請檢查並修改自動填入的資料。');
    }).catch(err=>{
      alert('❌ AI 辨識失敗：'+err.message+'\n\n請確認：\n1. Hugging Face Token 正確\n2. 圖片清晰可讀\n3. 網絡連接正常');
    }).finally(()=>{
      if(loadEl)loadEl.classList.remove('show');btns.forEach(b=>b.disabled=false);
    });
  }
  function applyScannedData(data){
    const r=window._editing;
    if(data.name)r.name=data.name;
    if(data.capacity)r.capacity=data.capacity;
    if(data.date)r.date=data.date;
    if(data.tags&&data.tags.length)r.tags=data.tags;
    if(data.note)r.note=data.note;
    if(data.groups&&data.groups.length){
      r.groups=data.groups.map(g=>({name:g.name||'材料',items:(g.items||[]).map(it=>({name:it.name||'',gram:String(it.gram||'')}))}));
    }
    if(data.steps&&data.steps.length){r.steps=data.steps.map(s=>({desc:typeof s==='string'?s:s.desc||''}));}
    renderEditor();
  }

  // ===== 初始化 =====
  document.getElementById('editorBg').onclick=e=>{if(e.target.id==='editorBg')closeEditor();};
  document.getElementById('detailBg').onclick=e=>{if(e.target.id==='detailBg')closeDetail();};
  document.getElementById('labelBg').onclick=e=>{if(e.target.id==='labelBg')closeLabel();};
  document.getElementById('settingsBg').onclick=e=>{if(e.target.id==='settingsBg')closeSettings();};
  document.getElementById('prodEditorBg').onclick=e=>{if(e.target.id==='prodEditorBg')closeProdEditor();};
  document.getElementById('prodDetailBg').onclick=e=>{if(e.target.id==='prodDetailBg')closeProdDetail();};
  document.getElementById('pickRecipeBg').onclick=e=>{if(e.target.id==='pickRecipeBg')closePickRecipe();};
  document.getElementById('welcomeBg').onclick=e=>{if(e.target.id==='welcomeBg')closeWelcome();};
  document.getElementById('search').oninput=renderList;
  document.getElementById('prodSearch').oninput=renderProdList;

  if(isFirstRun()){loadDemoData();renderTabs();renderList();renderRecipeTagFilter();setTimeout(showWelcome,400);}else{renderTabs();renderList();renderRecipeTagFilter();}
  </script>
</body>
</html>
